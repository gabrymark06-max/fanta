[project]
name = "fantabot"
version = "0.1.0"
description = "Assistente d'asta e di stagione per il fantacalcio Classic, su Telegram"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==21.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
sviluppo = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fantabot = "fantabot.bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
